name: ben-rtk-weekly-review
description: |
  Use when: Running the weekly RTK (Rust Token Killer) performance review.
  Triggers: "rtk review", "rtk weekly", "check rtk", "token savings review",
            "rtk performance", "how is rtk doing".
  Does: Gathers RTK analytics -> reads prior log -> appends dated entry ->
        updates wrap list if new high-value candidates found ->
        sends iMessage ONLY on kill/expand/usage signal.
  NOT for: Changing RTK config, installing RTK, one-off token queries.

provider: claude
model: haiku

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: GATHER — parallel data collection
  # ═══════════════════════════════════════════════════════════════

  - id: rtk-gain
    bash: rtk gain 2>&1

  - id: rtk-session
    bash: rtk session 2>&1

  - id: rtk-discover
    bash: rtk discover -a --since 7 2>&1

  - id: rtk-economics
    bash: rtk cc-economics 2>&1

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: CONTEXT — read prior log
  # ═══════════════════════════════════════════════════════════════

  - id: read-log
    bash: |
      tail -60 ~/Vault/Claude-Code/02-implementation/rtk-evaluation/WEEKLY_GAIN_LOG.md 2>/dev/null || \
        echo "No prior log found — this is the first run."

  - id: read-usage-guide
    bash: cat ~/Vault/Claude-Code/02-implementation/rtk-evaluation/USAGE_GUIDE.md 2>/dev/null | head -80

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: SYNTHESISE — write log entry + conditional actions
  # ═══════════════════════════════════════════════════════════════

  - id: synthesise
    command: ben-rtk-synthesise
    depends_on: [rtk-gain, rtk-session, rtk-discover, rtk-economics, read-log, read-usage-guide]
    context: fresh
