name: ben-cover-letter
description: |
  Use when: Drafting a cover letter for a job application.
  Triggers: "cover letter", "write a cover letter", "draft cover letter",
            "apply for this job", "cover letter for [role]".
  Input: Job listing URL or pasted job details (ideally from Daily Job Alerts Tier 1 output).
  Does: Fetches PD from URL -> reads CV from Google Drive -> drafts 1-page cover letter
        in Australian English -> saves as Google Doc with PD + apply link.
  NOT for: CV updates, LinkedIn profile, generic applications without a specific PD.

provider: claude
model: sonnet

nodes:
  - id: fetch-pd
    command: ben-cover-letter-fetch-pd

  - id: draft
    command: ben-cover-letter-draft
    depends_on: [fetch-pd]
    context: fresh
    model: opus[1m]

  - id: create-doc
    command: ben-cover-letter-create-doc
    depends_on: [draft]
    context: fresh
