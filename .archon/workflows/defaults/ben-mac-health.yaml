name: ben-mac-health
description: |
  Use when: You want an on-demand Mac system health report.
  Triggers: "mac health", "system health", "mac performance", "check mac", "system report",
            "how is my mac", "mac status", "performance check", "disk space", "memory pressure".
  Does: Gathers CPU/memory/disk/thermal/process data -> synthesises a health score and
        prioritised recommendations -> saves report to Vault.
  NOT for: Actually changing system settings — this is read-only analysis.

provider: claude
model: haiku

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: GATHER — parallel system data collection
  # ═══════════════════════════════════════════════════════════════

  - id: resources
    bash: |
      echo "=== SYSTEM INFO ==="
      sw_vers
      sysctl -n machdep.cpu.brand_string
      echo "Uptime: $(uptime)"
      echo ""
      echo "=== MEMORY ==="
      vm_stat | head -20
      echo "Swap usage:"
      sysctl vm.swapusage
      echo ""
      echo "=== CPU LOAD ==="
      top -l 1 -n 0 | head -15
      echo ""
      echo "=== DISK ==="
      df -h / /System/Volumes/Data 2>/dev/null | head -5
      du -sh ~/Library/Caches 2>/dev/null | head -5
      du -sh /private/var/folders 2>/dev/null | head -3

  - id: processes
    bash: |
      echo "=== TOP PROCESSES by CPU ==="
      ps aux --sort=-%cpu 2>/dev/null | head -15 || ps aux | sort -k3 -rn | head -15
      echo ""
      echo "=== TOP PROCESSES by MEM ==="
      ps aux | sort -k4 -rn | head -10
      echo ""
      echo "=== LAUNCHD SERVICES (user) ==="
      launchctl list 2>/dev/null | grep -v "^-" | head -30
      echo ""
      echo "=== BACKGROUND HEAVY PROCESSES ==="
      ps aux | awk '$3 > 5.0 || $4 > 5.0 {print $0}' | head -15

  - id: thermal-storage
    bash: |
      echo "=== THERMAL ==="
      # Check for thermal throttling
      pmset -g thermlog 2>/dev/null | tail -5 || echo "No thermal log available"
      echo ""
      echo "=== BATTERY / POWER ==="
      pmset -g batt 2>/dev/null | head -5
      pmset -g ps 2>/dev/null | head -5
      echo ""
      echo "=== LARGE FILES (> 1GB) ==="
      find ~ -maxdepth 4 -size +1G 2>/dev/null | head -10
      echo ""
      echo "=== RECENT CRASHES ==="
      ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -8

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: SYNTHESISE + REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: ben-mac-health-report
    depends_on: [resources, processes, thermal-storage]
    context: fresh
