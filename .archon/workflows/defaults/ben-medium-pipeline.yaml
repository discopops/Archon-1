name: ben-medium-pipeline
description: |
  Use when: You want to run the full Medium content pipeline manually.
  Triggers: "medium pipeline", "run medium digest", "medium weekly digest",
            "medium insights", "sync medium to wiki", "medium articles".
  Does: Gmail -> parse newsletters -> categorize articles -> append to Vault ->
        generate AI insights via Gemini -> sync new articles as wiki pages.
  NOT for: Non-Medium content, real-time news.

  Normally split across two scheduled tasks:
    - medium-weekly-digest (Saturday 3pm) -> digest + Vault append
    - medium-article-insights (Friday 6pm) -> Gemini insights + wiki sync
  This workflow runs the full chain on demand.

provider: claude
model: haiku

nodes:
  - id: digest
    command: ben-medium-digest-fetch

  - id: insights
    bash: |
      cd "/Users/BLW_M2_HOME/Scripts_&_Tools/Medium_Automation" && \
      uv run generate_insights.py 2>&1
    depends_on: [digest]

  - id: wiki-sync
    bash: |
      bash "/Users/BLW_M2_HOME/Scripts_&_Tools/wiki_builder/run_medium_insights_wiki.sh" 2>&1
    depends_on: [insights]

  - id: report
    prompt: |
      Summarise the Medium pipeline results.

      ## Digest output
      $digest.output

      ## Insights output
      $insights.output

      ## Wiki sync output
      $wiki-sync.output

      Write a brief plain-text summary (5 lines max):
      - How many new articles were in this week's digest
      - How many category insights were generated
      - How many new wiki pages were added
      - Any errors to flag
      - Output files: digest path, insights path
    depends_on: [wiki-sync]
    allowed_tools: []
