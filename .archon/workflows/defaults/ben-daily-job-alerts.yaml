name: ben-daily-job-alerts
description: |
  Use when: Running the daily job alerts briefing.
  Triggers: "job alerts", "daily jobs", "job briefing", "check job alerts",
            "what jobs came in", "job search digest".
  Does: Fetches job alert emails from Gmail -> labels/archives processed messages ->
        LLM extracts structured job data -> deduplicates -> filters Brisbane/remote ->
        scores 0-100 -> tiers (1/2/3) -> posts Slack briefing.
  NOT for: Searching specific jobs, updating CV, writing cover letters
           (use ben-cover-letter for that after reviewing Tier 1 results).

provider: claude
model: sonnet

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: FETCH — get job alert emails
  # ═══════════════════════════════════════════════════════════════

  - id: fetch-emails
    command: ben-job-alerts-fetch

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: EXTRACT — LLM parse each email into structured jobs
  # ═══════════════════════════════════════════════════════════════

  - id: extract-jobs
    command: ben-job-alerts-extract
    depends_on: [fetch-emails]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: SCORE — deduplicate, filter, score, tier
  # ═══════════════════════════════════════════════════════════════

  - id: score-jobs
    command: ben-job-alerts-score
    depends_on: [extract-jobs]
    context: fresh
    model: haiku

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: REPORT — Slack briefing + persist artefacts
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: ben-job-alerts-report
    depends_on: [score-jobs]
    context: fresh
