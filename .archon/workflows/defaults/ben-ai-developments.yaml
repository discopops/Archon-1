name: ben-ai-developments
description: |
  Use when: Checking for the latest AI/LLM/agent developments across all major labs and frameworks.
  Triggers: "ai developments", "daily ai digest", "what shipped in ai today", "ai news",
            "agent framework news", "llm releases", "what's new in ai", "ai digest full".
  Does: Research 50+ official sources (Anthropic, OpenAI, Google, LangChain, Microsoft,
        AWS, Vercel, Cloudflare, Mistral, MCP, A2A, etc.) for genuinely new last-24h
        items -> formats ranked digest -> saves to Vault -> syncs to personal wiki.
  NOT for: Casual news browsing — use ben-ai-blog-digest for the quick 4-source RSS version.
  Distinct from: ben-ai-blog-digest (quick RSS, 4 sources) — this hits 50+ official changelog
                 and launch surfaces and covers SDKs, protocols, and release notes.

provider: claude
model: opus

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: GATHER — check all official sources in parallel groups
  # ═══════════════════════════════════════════════════════════════

  - id: check-date
    bash: |
      date '+%Y-%m-%d %H:%M %Z'
      # Check most recent saved digest to avoid repeats
      ls -t ~/Vault/Claude-Code/03-reference/ai-developments/daily-ai-agent-llm-digest-*.md 2>/dev/null | head -3

  - id: scan-labs
    prompt: |
      Today: $check-date.output

      You are checking official changelog, release-note, and launch surfaces for the biggest AI labs.
      Use WebFetch to check each URL below. For each one, extract any items dated within the
      last 24 hours. Skip sources with no qualifying new items silently.

      Check these sources (select the 6-8 most likely to have moved in the last 24h):
      - https://www.anthropic.com/news
      - https://docs.anthropic.com/en/release-notes/overview
      - https://support.anthropic.com/en/articles/12138966-release-notes
      - https://openai.com/news/
      - https://platform.openai.com/docs/changelog
      - https://help.openai.com/en/articles/9624314-model-release-notes
      - https://openai.com/research/index/
      - https://github.com/openai/openai-agents-python/releases
      - https://ai.google.dev/gemini-api/docs/changelog
      - https://cloud.google.com/vertex-ai/generative-ai/docs/release-notes
      - https://google.github.io/adk-docs/release-notes/
      - https://cloud.google.com/blog/products/ai-machine-learning

      Output a JSON array of raw findings:
      [{"source": "url", "date": "YYYY-MM-DD", "title": "...", "summary": "...", "url": "..."}]
      Output "[]" if nothing qualifies.
    depends_on: [check-date]

  - id: scan-frameworks
    prompt: |
      Today: $check-date.output

      Check these official framework and protocol release surfaces for items from the last 24 hours.
      Use WebFetch. Skip silently if no qualifying item.

      - https://changelog.langchain.com/
      - https://github.com/langchain-ai/langgraph/releases
      - https://github.com/langchain-ai/langchain/releases
      - https://github.com/modelcontextprotocol/specification/releases
      - https://github.com/a2aproject/A2A/releases
      - https://github.com/microsoft/autogen/releases
      - https://learn.microsoft.com/en-us/azure/ai-foundry/agents/whats-new
      - https://vercel.com/changelog
      - https://github.com/vercel/ai/releases
      - https://developers.cloudflare.com/changelog/product/agents/
      - https://ai.pydantic.dev/changelog.html
      - https://docs.crewai.com/changelog
      - https://docs.mistral.ai/platform/changelog/
      - https://docs.cohere.com/changelog

      Output JSON array: [{"source": "url", "date": "YYYY-MM-DD", "title": "...", "summary": "...", "url": "..."}]
      Output "[]" if nothing qualifies.
    depends_on: [check-date]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: SYNTHESISE + SAVE — dedupe, rank, format, persist
  # ═══════════════════════════════════════════════════════════════

  - id: format-and-save
    command: ben-ai-developments-format
    depends_on: [scan-labs, scan-frameworks]
    context: fresh
