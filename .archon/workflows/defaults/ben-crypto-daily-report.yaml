name: ben-crypto-daily-report
description: |
  Use when: Running the daily crypto portfolio report.
  Triggers: "crypto report", "daily crypto", "portfolio report", "check crypto",
            "how is my portfolio", "crypto daily".
  Does: CoinSpot + Binance data -> executor status -> TradingView chart analysis ->
        opportunity scan -> formatted report -> Telegram summary + Vault save.
  NOT for: Executing trades (never do this), changing trade plans, historical analysis.
  REQUIRES: TradingView desktop open. CoinSpot API keys in ~/.env.

provider: claude
model: sonnet

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: DATA — parallel gather (all independent)
  # ═══════════════════════════════════════════════════════════════

  - id: portfolio-data
    bash: |
      cd "/Users/BLW_M2_HOME/Scripts_&_Tools/crypto"
      python3 daily_portfolio_report.py --pretty 2>&1
      # Saves to /tmp/cs_portfolio.json

  - id: executor-status
    bash: |
      python3 "/Users/BLW_M2_HOME/Scripts_&_Tools/crypto/trade_plan_executor.py" --status 2>&1 | head -10
      echo "=== Trade Plan ==="
      cat "/Users/BLW_M2_HOME/Scripts_&_Tools/crypto/daily_trade_plan.json" | python3 -m json.tool 2>&1
      echo "=== Recent Log ==="
      tail -20 "/Users/BLW_M2_HOME/Scripts_&_Tools/logs/trade_executor.log" 2>/dev/null

  - id: tv-health
    bash: echo "tv_preflight=ready"
    # TradingView health check happens inside the analysis command

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: ANALYSIS — TradingView per coin + opportunity scan
  # ═══════════════════════════════════════════════════════════════

  - id: tv-analysis
    command: ben-crypto-tv-analysis
    depends_on: [portfolio-data, executor-status, tv-health]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: REPORT — format, Telegram, Vault
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: ben-crypto-report
    depends_on: [tv-analysis]
    context: fresh
