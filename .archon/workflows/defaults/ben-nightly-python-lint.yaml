name: ben-nightly-python-lint
description: |
  Use when: Checking Python code quality across all recently changed files in ~/GitHub.
  Triggers: "python lint", "nightly lint", "check python files", "flake8 run", "mypy check",
            "python code quality", "lint changed files", "python errors".
  Does: Finds Python files changed in the last 7 days under ~/GitHub (excluding .venv,
        node_modules, __pycache__) -> runs flake8 and mypy -> groups findings by repo ->
        posts compact report to Slack.
  NOT for: Linting a specific file or project in isolation — run flake8/mypy directly for that.

provider: claude
model: haiku

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: SCAN — find changed Python files and lint them
  # ═══════════════════════════════════════════════════════════════

  - id: scan
    bash: |
      set -euo pipefail
      GITHUB_DIR="$HOME/GitHub"
      DAYS="${1:-7}"

      echo "=== SCAN: Python files changed in last ${DAYS}d under $GITHUB_DIR ==="
      echo "Run date: $(date '+%Y-%m-%d %H:%M %Z')"
      echo ""

      # Find changed Python files, excluding common noise dirs
      if command -v fd &>/dev/null; then
        FILES=$(fd --absolute-path --hidden --changed-within "${DAYS}d" -t f -e py \
          --exclude ".venv" --exclude "node_modules" --exclude "__pycache__" \
          --exclude ".git" --exclude "dist" --exclude "build" \
          . "$GITHUB_DIR" 2>/dev/null || true)
      else
        FILES=$(find "$GITHUB_DIR" -name "*.py" -newer "$GITHUB_DIR" \
          -not -path "*/.venv/*" -not -path "*/node_modules/*" \
          -not -path "*/__pycache__/*" -not -path "*/.git/*" \
          2>/dev/null | head -500 || true)
      fi

      FILE_COUNT=$(echo "$FILES" | grep -c "\.py$" || echo 0)
      echo "Found: $FILE_COUNT Python files changed"

      if [ "$FILE_COUNT" -eq 0 ]; then
        echo "RESULT: clean — no changed Python files"
        exit 0
      fi

      # Group by repo (first 2 path components after GitHub/)
      echo ""
      echo "=== REPOS WITH CHANGED FILES ==="
      echo "$FILES" | grep "\.py$" | sed "s|$GITHUB_DIR/||" | cut -d'/' -f1 | sort | uniq -c | sort -rn | head -20

      echo ""
      echo "=== LINT RESULTS ==="

      ISSUES=0
      CLEAN=0

      while IFS= read -r f; do
        [ -z "$f" ] || [ ! -f "$f" ] && continue

        REPO=$(echo "$f" | sed "s|$GITHUB_DIR/||" | cut -d'/' -f1)
        RELPATH=$(echo "$f" | sed "s|$GITHUB_DIR/||")

        FLAKE_OUT=""
        MYPY_OUT=""

        if command -v flake8 &>/dev/null; then
          FLAKE_OUT=$(flake8 --max-line-length=120 "$f" 2>/dev/null || true)
        fi

        if command -v mypy &>/dev/null; then
          MYPY_OUT=$(mypy --ignore-missing-imports --no-error-summary "$f" 2>/dev/null | grep -v "^Success" || true)
        fi

        if [ -n "$FLAKE_OUT" ] || [ -n "$MYPY_OUT" ]; then
          echo ""
          echo "--- $RELPATH ---"
          [ -n "$FLAKE_OUT" ] && echo "$FLAKE_OUT" | head -10
          [ -n "$MYPY_OUT" ] && echo "$MYPY_OUT" | head -5
          ISSUES=$((ISSUES + 1))
        else
          CLEAN=$((CLEAN + 1))
        fi
      done <<< "$FILES"

      echo ""
      echo "=== SUMMARY ==="
      echo "Files with issues: $ISSUES"
      echo "Clean files: $CLEAN"
      echo "Total checked: $((ISSUES + CLEAN))"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: REPORT — format and post to Slack
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: ben-nightly-python-lint-report
    depends_on: [scan]
    context: fresh
