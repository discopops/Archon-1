name: ben-youtube-digest
description: |
  Use when: Running the daily YouTube Watch Later digest.
  Triggers: "youtube digest", "youtube daily digest", "watch later digest",
            "summarise watch later", "yt digest".
  Does: Extracts Watch Later via AppleScript -> fetches transcripts ->
        LLM summarises each video -> auto-files to playlists -> Slack report.
  NOT for: Searching YouTube, finding new videos, managing subscriptions.
  REQUIRES: Chrome running and logged in to YouTube. Composio YouTube connection active.

provider: claude
model: sonnet

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: EXTRACT — Watch Later via AppleScript (only working method)
  # ═══════════════════════════════════════════════════════════════

  - id: extract-wl
    bash: |
      # Ensure Chrome is running
      osascript -e 'tell application "Google Chrome" to activate' 2>/dev/null
      sleep 2
      cd "/Users/BLW_M2_HOME/Scripts_&_Tools/YouTube_Automation"
      python3 extract_wl_applescript.py 2>&1
      echo "exit_code=$?"

  - id: check-extraction
    bash: |
      if [ -f /tmp/yt_wl_videos.json ]; then
        COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/yt_wl_videos.json'))))")
        echo "videos_found=$COUNT"
        cat /tmp/yt_wl_videos.json
      else
        echo "videos_found=0"
        echo "ERROR: /tmp/yt_wl_videos.json not created"
      fi
    depends_on: [extract-wl]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: TRANSCRIPTS — fetch via daily_digest.py
  # ═══════════════════════════════════════════════════════════════

  - id: fetch-transcripts
    bash: |
      VIDEO_IDS=$(python3 -c "
      import json
      videos = json.load(open('/tmp/yt_wl_videos.json'))
      print(json.dumps([v['id'] for v in videos]))
      " 2>/dev/null)
      cd "/Users/BLW_M2_HOME/Scripts_&_Tools/YouTube_Automation"
      ~/.local/bin/uv run python daily_digest.py \
        --export-data --export-json /tmp/yt_transcripts.json \
        --video-ids "$VIDEO_IDS" \
        --titles /tmp/yt_titles.json 2>&1
    depends_on: [check-extraction]
    when: "check-extraction.output contains 'videos_found=' and not 'videos_found=0'"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: SUMMARISE + FILE
  # ═══════════════════════════════════════════════════════════════

  - id: summarise
    command: ben-youtube-summarise
    depends_on: [fetch-transcripts]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: ben-youtube-report
    depends_on: [summarise]
    context: fresh
