name: ben-api-credits
description: |
  Use when: Checking credit balances and billing tiers across all AI providers.
  Triggers: "api credits", "check credits", "how much credit", "ai billing", "provider balance",
            "anthropic balance", "openai credits", "google api tier", "kimi credits",
            "openrouter balance", "what am i paying", "credit check".
  Does: Hits each provider's usage/billing API or page -> reports current balance,
        tier (free/paid), estimated runway, and flags any providers running low.
  NOT for: Changing billing settings or topping up credit.

provider: claude
model: haiku

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: GATHER — query each provider in parallel
  # ═══════════════════════════════════════════════════════════════

  - id: check-anthropic
    bash: |
      # Anthropic usage via API
      ANTHROPIC_KEY=$(grep -E '^ANTHROPIC_API_KEY=' ~/.env | cut -d= -f2- | tr -d '"')
      if [ -z "$ANTHROPIC_KEY" ]; then echo "ANTHROPIC: no key found"; exit 0; fi
      # Check current month usage
      MONTH=$(date '+%Y-%m')
      curl -s --max-time 10 \
        "https://api.anthropic.com/v1/usage?month=${MONTH}" \
        -H "x-api-key: ${ANTHROPIC_KEY}" \
        -H "anthropic-version: 2023-06-01" 2>/dev/null || echo "ANTHROPIC: api call failed"

  - id: check-openai
    bash: |
      OPENAI_KEY=$(grep -E '^OPENAI_API_KEY=' ~/.env | cut -d= -f2- | tr -d '"')
      if [ -z "$OPENAI_KEY" ]; then echo "OPENAI: no key found"; exit 0; fi
      # Check credit balance
      curl -s --max-time 10 \
        "https://api.openai.com/dashboard/billing/credit_grants" \
        -H "Authorization: Bearer ${OPENAI_KEY}" 2>/dev/null || echo "OPENAI: api call failed"

  - id: check-openrouter
    bash: |
      OR_KEY=$(grep -E '^OPENROUTER_API_KEY=' ~/.env | cut -d= -f2- | tr -d '"')
      if [ -z "$OR_KEY" ]; then echo "OPENROUTER: no key found"; exit 0; fi
      curl -s --max-time 10 \
        "https://openrouter.ai/api/v1/auth/key" \
        -H "Authorization: Bearer ${OR_KEY}" 2>/dev/null || echo "OPENROUTER: api call failed"

  - id: check-google
    bash: |
      # Check all Google API keys in ~/.env and determine their project/tier
      echo "=== GOOGLE KEYS ==="
      grep -E '^[A-Z_]*GOOGLE[A-Z_]*KEY|GEMINI[A-Z_]*KEY|GOOGLE_API_KEY' ~/.env 2>/dev/null | \
        sed 's/=.*//' | while read -r varname; do
        echo "Key var: $varname"
      done
      # Try gcloud project list for billing context
      if command -v gcloud &>/dev/null; then
        gcloud projects list --format='table(projectId,name)' 2>/dev/null | head -10
        echo ""
        echo "Billing accounts:"
        gcloud billing accounts list --format='table(name,displayName,open)' 2>/dev/null | head -10
      else
        echo "gcloud not available"
      fi

  - id: check-misc
    bash: |
      # Kimi / Moonshot, Groq, and other keys found in ~/.env
      echo "=== OTHER PROVIDERS ==="
      for pattern in "KIMI\|MOONSHOT" "GROQ" "TOGETHER\|TOGETHER_AI" "COHERE" "MISTRAL" "DEEPSEEK" "PERPLEXITY"; do
        keys=$(grep -iE "$pattern.*KEY|KEY.*$pattern" ~/.env 2>/dev/null | sed 's/=.*//')
        [ -n "$keys" ] && echo "$pattern key found: $keys"
      done
      # Also report any monthly cost data from local logs
      find ~/Vault/Claude-Code/01-analysis/ -name "*cost*" -o -name "*billing*" -o -name "*credit*" 2>/dev/null | \
        sort -t/ -k7 | tail -3

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: FORMAT REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: ben-api-credits-report
    depends_on: [check-anthropic, check-openai, check-openrouter, check-google, check-misc]
    context: fresh
