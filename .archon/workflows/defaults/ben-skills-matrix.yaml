name: ben-skills-matrix
description: |
  Use when: You want to see which skills are installed across all AI coding agents.
  Triggers: "skills matrix", "skill coverage", "which skills are installed", "agent skills",
            "skills comparison", "codex skills", "claude skills", "skills table",
            "what skills does codex have", "skill inventory".
  Does: Scans skill install locations for Claude Code, Codex, Antigravity/Gemini, and
        Hermes -> builds a cross-agent matrix showing coverage per skill ->
        flags gaps and duplication.
  NOT for: Installing or removing skills — use the skill catalog for that.

provider: claude
model: haiku

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: SCAN — parallel scan of each runtime's skill locations
  # ═══════════════════════════════════════════════════════════════

  - id: scan-canonical
    bash: |
      echo "=== CANONICAL SKILLS (~/.agents/skills/) ==="
      # Primary store — shared across all runtimes via symlinks
      find ~/.agents/skills -name "SKILL.md" -maxdepth 3 2>/dev/null | \
        sed "s|$HOME/.agents/skills/||" | sed 's|/SKILL.md||' | sort
      echo "---TOTAL: $(find ~/.agents/skills -name 'SKILL.md' -maxdepth 3 2>/dev/null | wc -l | tr -d ' ')"

  - id: scan-claude-code
    bash: |
      echo "=== CLAUDE CODE (~/.claude/skills/) ==="
      find ~/.claude/skills -name "SKILL.md" -maxdepth 4 2>/dev/null | \
        sed "s|$HOME/.claude/skills/||" | sed 's|/SKILL.md||' | sort
      echo "---TOTAL: $(find ~/.claude/skills -name 'SKILL.md' -maxdepth 4 2>/dev/null | wc -l | tr -d ' ')"
      echo ""
      echo "=== CLAUDE CODE COMMANDS (~/.claude/commands/) ==="
      ls ~/.claude/commands/ 2>/dev/null | grep '\.md$' | sed 's/\.md$//' | sort
      echo "---TOTAL: $(ls ~/.claude/commands/*.md 2>/dev/null | wc -l | tr -d ' ')"

  - id: scan-codex
    bash: |
      echo "=== CODEX (~/.codex-home/skills/) ==="
      find ~/.codex-home/skills -name "SKILL.md" -maxdepth 4 2>/dev/null | \
        sed "s|$HOME/.codex-home/skills/||" | sed 's|/SKILL.md||' | sort
      echo "---TOTAL: $(find ~/.codex-home/skills -name 'SKILL.md' -maxdepth 4 2>/dev/null | wc -l | tr -d ' ')"

  - id: scan-gemini
    bash: |
      echo "=== ANTIGRAVITY / GEMINI (~/.gemini/) ==="
      find ~/.gemini -name "SKILL.md" -maxdepth 5 2>/dev/null | \
        sed "s|$HOME/.gemini/||" | sed 's|/SKILL.md||' | sort
      echo "---TOTAL: $(find ~/.gemini -name 'SKILL.md' -maxdepth 5 2>/dev/null | wc -l | tr -d ' ')"
      echo ""
      echo "=== HERMES (~/.hermes/skills/) ==="
      find ~/.hermes/skills -name "SKILL.md" -maxdepth 4 2>/dev/null | \
        sed "s|$HOME/.hermes/skills/||" | sed 's|/SKILL.md||' | sort 2>/dev/null
      echo "---TOTAL: $(find ~/.hermes/skills -name 'SKILL.md' -maxdepth 4 2>/dev/null | wc -l | tr -d ' ' 2>/dev/null)"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: BUILD MATRIX + REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: ben-skills-matrix-report
    depends_on: [scan-canonical, scan-claude-code, scan-codex, scan-gemini]
    context: fresh
