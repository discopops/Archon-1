name: ben-intelligence-forensic
description: |
  Use when: Deep-diving on a specific topic, person, company, or event.
  Triggers: "research [topic]", "deep dive [topic]", "intelligence on [topic]",
            "forensic research", "investigate [topic]", "brief me on [topic]".
  Does: Multi-source web research -> cross-reference -> synthesis ->
        structured intelligence brief -> Vault save.
  NOT for: Quick factual lookups (ask directly), live data (use specific tools).
  ARGUMENTS: The topic or question to research (required).

provider: claude
model: opus

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: GATHER — multi-source parallel research
  # ═══════════════════════════════════════════════════════════════

  - id: primary-search
    prompt: |
      Research topic: $ARGUMENTS

      Use WebSearch and WebFetch to gather primary sources on this topic.
      Focus on: authoritative sources, recent developments (last 12 months prioritised),
      official statements, data/statistics, key players and relationships.

      Collect at minimum:
      - 5 distinct sources
      - At least one primary/official source (gov, company website, academic)
      - At least one news/journalism source
      - Any relevant data tables, figures, or timelines

      For each source, note: URL, title, date, key claims/data extracted.

      Save findings to $ARTIFACTS_DIR/sources.json as:
      {"sources": [{"url":..., "title":..., "date":..., "key_points": [...]}]}

  - id: context-scan
    prompt: |
      Research topic: $ARGUMENTS

      Scan for background context and framing:
      - Historical background and how the current situation developed
      - Key stakeholders, organisations, and their positions
      - Competing narratives or interpretations
      - Related events, precedents, or comparisons

      Use WebSearch to find context from different angles (industry analysis,
      academic perspective, different political/geographic viewpoints if relevant).

      Save to $ARTIFACTS_DIR/context.json as:
      {"background": "...", "stakeholders": [...], "narratives": [...], "related": [...]}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: SYNTHESISE — cross-reference and analyse
  # ═══════════════════════════════════════════════════════════════

  - id: synthesise
    command: ben-intelligence-synthesise
    depends_on: [primary-search, context-scan]
    context: fresh
    model: opus

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: BRIEF — structured output + Vault save
  # ═══════════════════════════════════════════════════════════════

  - id: brief
    command: ben-intelligence-brief
    depends_on: [synthesise]
    context: fresh
